# SPDX-License-Identifier: Apache-2.0
#
# Continuous integration for weavec0.
#
# The normal matrix builds and executes the full WIR correctness/golden ladder
# plus process-level CLI tests on Linux and macOS. A separate Linux audit job
# measures the linked handwritten LLVM implementation against the test corpus,
# CLI error paths, and the pinned weavec1 production corpus.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          echo "Tool versions:"
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Run complete WIR and CLI ladders
        run: bash scripts/run-tests.sh

  coverage:
    name: LLVM path & bootstrap-surface audit
    runs-on: ubuntu-latest
    env:
      WEAVEC0_MIN_FUNCTION_COVERAGE: "95"
      WEAVEC0_MIN_BLOCK_COVERAGE: "87"
      WEAVEC0_MIN_BRANCH_OUTCOME_COVERAGE: "70"

    steps:
      - name: Checkout weavec0
        uses: actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          clang --version
          llvm-as --version
          llvm-dis --version

      - name: Checkout pinned weavec1 corpus
        run: |
          commit="$(cat WEAVEC1_BOOTSTRAP_COMMIT)"
          git clone --filter=blob:none --no-checkout \
            https://github.com/ahojukka5/weavec1.git build/weavec1-audit
          git -C build/weavec1-audit fetch --depth 1 origin "$commit"
          git -C build/weavec1-audit checkout --detach FETCH_HEAD
          test "$(git -C build/weavec1-audit rev-parse HEAD)" = "$commit"

      - name: Measure WIR and pinned Stage 1 workloads
        run: bash scripts/run-coverage.sh --weavec1-dir build/weavec1-audit

      - name: Add CLI error paths and require full function coverage
        run: |
          WEAVEC0_MIN_FUNCTION_COVERAGE=100 \
            bash scripts/extend-coverage-with-cli.sh

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: weavec0-bootstrap-audit
          path: |
            build/coverage/coverage-map.tsv
            build/coverage/coverage-report.json
            build/coverage/bootstrap-surface.json
