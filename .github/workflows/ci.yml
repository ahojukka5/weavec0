# SPDX-License-Identifier: Apache-2.0
#
# Continuous integration for weavec0.
#
# The normal matrix builds and executes the full correctness/golden ladder on
# Linux and macOS. A separate Linux audit job measures the linked handwritten
# LLVM implementation against both the test corpus and the pinned weavec1
# production corpus.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-cli-integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/cover-cli-error-paths'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/cover-cli-error-paths
          fetch-depth: 0

      - name: Apply focused ladder integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path("build.sh")
          text = build.read_text(encoding="utf-8")
          old = '''main() {
            build_weavec0

            log "correctness phase"
            run_manifest_correctness
'''
          new = '''main() {
            build_weavec0

            log "CLI error-path phase"
            bash "$BOOTSTRAP_DIR/scripts/run-cli-tests.sh" \
              "$WEAVEC0" "$BUILD_DIR/cli-tests"

            log "correctness phase"
            run_manifest_correctness
'''
          if text.count(old) != 1:
              raise SystemExit("build.sh integration anchor not found exactly once")
          build.write_text(text.replace(old, new), encoding="utf-8")

          coverage = Path("scripts/run-coverage.sh")
          text = coverage.read_text(encoding="utf-8")
          old = ''': > "$RAW_TSV"

          run_compiler_case() {
'''
          new = ''': > "$RAW_TSV"

          printf '[coverage] run CLI error-path corpus\\n' >&2
          WEAVEC0_COVERAGE_OUT="$RAW_TSV" \
            bash "$ROOT/scripts/run-cli-tests.sh" \
              "$INSTRUMENTED_BIN" "$BUILD_DIR/cli-tests"

          run_compiler_case() {
'''
          if text.count(old) != 1:
              raise SystemExit("run-coverage.sh integration anchor not found exactly once")
          coverage.write_text(text.replace(old, new), encoding="utf-8")
          PY

          rm -f .github/workflows/apply-cli-test-integration.yml
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.sh scripts/run-coverage.sh .github/workflows
          git commit -m "test: run CLI errors in all ladders"
          git push origin HEAD:agent/cover-cli-error-paths

  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          echo "Tool versions:"
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build & run test ladder
        run: ./build.sh

  coverage:
    name: LLVM path & bootstrap-surface audit
    runs-on: ubuntu-latest
    env:
      WEAVEC0_MIN_FUNCTION_COVERAGE: "95"
      WEAVEC0_MIN_BLOCK_COVERAGE: "87"
      WEAVEC0_MIN_BRANCH_OUTCOME_COVERAGE: "70"

    steps:
      - name: Checkout weavec0
        uses: actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          clang --version
          llvm-as --version
          llvm-dis --version

      - name: Checkout pinned weavec1 corpus
        run: |
          commit="$(cat WEAVEC1_BOOTSTRAP_COMMIT)"
          git clone --filter=blob:none --no-checkout \
            https://github.com/ahojukka5/weavec1.git build/weavec1-audit
          git -C build/weavec1-audit fetch --depth 1 origin "$commit"
          git -C build/weavec1-audit checkout --detach FETCH_HEAD
          test "$(git -C build/weavec1-audit rev-parse HEAD)" = "$commit"

      - name: Measure LLVM execution and bootstrap surface
        run: bash scripts/run-coverage.sh --weavec1-dir build/weavec1-audit

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: weavec0-bootstrap-audit
          path: |
            build/coverage/coverage-map.tsv
            build/coverage/coverage-report.json
            build/coverage/bootstrap-surface.json
