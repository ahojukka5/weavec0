# SPDX-License-Identifier: Apache-2.0
name: apply function binding scope

on:
  pull_request:
    branches: [master]
    paths:
      - scripts/apply-function-binding-scope.py
      - .github/workflows/apply-function-binding-scope.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/integrate-function-binding-scope'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/integrate-function-binding-scope
          fetch-depth: 0

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq llvm clang >/dev/null

      - name: Apply and validate integrated fix
        id: patch
        shell: bash
        run: |
          set +e
          python3 scripts/apply-function-binding-scope.py > /tmp/function-binding-scope.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: function-binding-scope-log
          path: /tmp/function-binding-scope.log

      - name: Propagate patch status
        if: steps.patch.outputs.status != '0'
        run: exit 1
