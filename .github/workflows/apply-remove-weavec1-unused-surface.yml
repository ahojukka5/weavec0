# SPDX-License-Identifier: Apache-2.0
name: apply weavec1 surface minimization

on:
  pull_request:
    branches: [master]
    paths:
      - scripts/apply-remove-weavec1-unused-surface.py
      - .github/workflows/apply-remove-weavec1-unused-surface.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/remove-weavec1-unused-surface'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-weavec1-unused-surface
          fetch-depth: 0

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq llvm clang >/dev/null

      - name: Configure commit identity
        run: |
          git config user.name "weavec0 minimization bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Correct parser-label removal list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-remove-weavec1-unused-surface.py')
          text = path.read_text()
          old = '["check_print", "parse_print", "print_close", "make_print", "parse_gt_i64", "parse_ge_i64"]'
          new = '["check_print", "parse_print", "print_close", "make_print"]'
          if text.count(old) != 1:
              raise SystemExit('expected parser-label list once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply and validate minimization
        id: minimize
        shell: bash
        run: |
          set +e
          python3 scripts/apply-remove-weavec1-unused-surface.py > /tmp/weavec1-surface-minimization.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload minimization log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weavec1-surface-minimization-log
          path: /tmp/weavec1-surface-minimization.log

      - name: Propagate minimization status
        if: steps.minimize.outputs.status != '0'
        run: exit 1
