# SPDX-License-Identifier: Apache-2.0
name: apply integer range fix

on:
  pull_request:
    branches: [master]
    paths:
      - scripts/apply-integer-range-fix.py
      - .github/workflows/apply-integer-range-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reject-out-of-range-integers'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/reject-out-of-range-integers
          fetch-depth: 0

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq llvm clang >/dev/null

      - name: Apply, validate, commit, and push
        shell: bash
        run: |
          set +e
          python3 scripts/apply-integer-range-fix.py > /tmp/integer-patch.log 2>&1
          status=$?
          if [[ $status == 0 ]]; then
            tail -n 40 /tmp/integer-patch.log
          else
            tail -n 160 /tmp/integer-patch.log
          fi
          exit "$status"
