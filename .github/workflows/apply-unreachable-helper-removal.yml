# SPDX-License-Identifier: Apache-2.0
name: apply unreachable helper removal

on:
  push:
    branches: [agent/remove-unreachable-helpers]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-unreachable-helpers
          fetch-depth: 0

      - name: Remove unreachable LLVM helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          removals = {
              Path("src/02_strings.ll"): [
                  ("weave_slice_starts_with_cstr", None),
              ],
              Path("src/07_emit_llvm.ll"): [
                  ("weave_emit_type_after_name", None),
                  ("weave_emit_expr_operand", "Emit an expression as an instruction operand."),
              ],
              Path("src/08_driver.ll"): [
                  ("weave_source_init_copy", "Copy a bounded caller buffer"),
                  ("weave_compile_buffer_to_buffer", "In-memory compilation"),
              ],
          }

          def remove_function(text: str, name: str, marker: str | None) -> str:
              lines = text.splitlines(keepends=True)
              pattern = re.compile(rf"^define\b.*@{re.escape(name)}\(")
              starts = [i for i, line in enumerate(lines) if pattern.search(line)]
              if len(starts) != 1:
                  raise SystemExit(f"expected exactly one definition of {name}, found {len(starts)}")
              start = starts[0]
              end = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == "}"), None)
              if end is None:
                  raise SystemExit(f"unterminated definition: {name}")

              begin = start
              if marker is not None:
                  markers = [i for i in range(start) if marker in lines[i]]
                  if len(markers) != 1:
                      raise SystemExit(f"expected exactly one comment marker for {name}, found {len(markers)}")
                  begin = markers[0]
                  while begin > 0:
                      previous = lines[begin - 1]
                      if previous.strip() == "" or previous.lstrip().startswith(";"):
                          begin -= 1
                          continue
                      break

              del lines[begin : end + 1]
              result = "".join(lines)
              result = re.sub(r"\n{4,}", "\n\n\n", result)
              return result

          for path, entries in removals.items():
              text = path.read_text(encoding="utf-8")
              for name, marker in entries:
                  text = remove_function(text, name, marker)
              if path == Path("src/08_driver.ll"):
                  text = text.replace(
                      "  - read or copy the input into an owned, null-terminated source buffer\n",
                      "  - read the input into an owned, null-terminated source buffer\n",
                  )
              path.write_text(text, encoding="utf-8")

          names = [name for entries in removals.values() for name, _ in entries]
          source_text = "\n".join(path.read_text(encoding="utf-8") for path in Path("src").glob("*.ll"))
          remaining = [name for name in names if name in source_text]
          if remaining:
              raise SystemExit("removed names still present: " + ", ".join(remaining))
          PY

      - name: Commit focused source change
        shell: bash
        run: |
          rm .github/workflows/apply-unreachable-helper-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/02_strings.ll src/07_emit_llvm.ll src/08_driver.ll \
            .github/workflows/apply-unreachable-helper-removal.yml
          git commit -m "refactor: remove unreachable Stage 0 helpers"
          git push origin HEAD:agent/remove-unreachable-helpers
