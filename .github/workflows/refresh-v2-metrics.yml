# SPDX-License-Identifier: Apache-2.0
name: refresh WIR v2 audit metrics

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/refresh-v2-metrics.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/wir-v2-finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wir-v2-finalize
          fetch-depth: 0

      - name: Refresh documented baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          old = '''- The combined test and pinned-`weavec1` corpus covers 98.17% of functions,
            90.16% of basic blocks, and 72.15% of conditional branch outcomes.'''
          new = '''- The combined test and pinned-`weavec1` corpus covers 100% of functions,
            92.54% of basic blocks, and 78.79% of conditional branch outcomes.'''
          if text.count(old) != 1:
              raise SystemExit('unexpected README coverage baseline')
          readme.write_text(text.replace(old, new, 1))

          coverage = Path('docs/COVERAGE.md')
          text = coverage.read_text()
          old = '''After removing five helpers proven unreachable by both the static call graph and
          the combined corpus, the measurement is:

          | Metric | Covered | Total | Coverage |
          |---|---:|---:|---:|
          | Functions | 215 | 219 | 98.17% |
          | Basic blocks | 1,283 | 1,423 | 90.16% |
          | Branch outcomes | 1,052 | 1,458 | 72.15% |'''
          new = '''After the WIR v2 bootstrap-profile finalization, the combined Stage 0,
          command-line, and pinned Stage 1 workload measures:

          | Metric | Covered | Total | Coverage |
          |---|---:|---:|---:|
          | Functions | 230 | 230 | 100.00% |
          | Basic blocks | 1,352 | 1,461 | 92.54% |
          | Branch outcomes | 1,174 | 1,490 | 78.79% |'''
          if text.count(old) != 1:
              raise SystemExit('unexpected coverage document baseline')
          coverage.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/COVERAGE.md
          git commit -m 'docs: record final WIR v2 audit baseline'
          git push origin HEAD:agent/wir-v2-finalize
